<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Cassidy's Flowers</title> 
    <link rel="stylesheet" href="redesign2.css" />
</head>
<body>
    <header>
        <nav class="top-nav">
            <a href="#">HOME</a>
            <a href="#" class="active">CONTACT US</a>
        </nav>
    </header>

    <section class="contact-container">
        <div class="left-side">
            <h1>Contact us</h1>
            <form>
                <label>Name</label>
                <input type="text" />

                <label>Email</label>
                <input type="email" />

                <label>Phone number</label>
                <input type="text" />

                <label>Comment</label>
                <textarea></textarea>

                <button type="submit" class="send-btn">Send</button>
            </form>

            <div class="hours">
                <h2>Hours</h2>
                <p>Monday <span>8:30AM–5:00PM</span></p>
                <p>Tuesday <span>8:30AM–5:00PM</span></p>
                <p>Wednesday <span>8:30AM–5:00PM</span></p>
                <p>Thursday <span>8:30AM–5:00PM</span></p>
                <p>Friday <span>8:30AM–5:00PM</span></p>
                <p>Saturday <span>8:30AM–1:00PM</span></p>
                <p>Sunday <span>CLOSED</span></p>
            </div>
        </div>

        <div class="right-side">
            <h1>Location</h1>
            <p>15 Main St S<br>Newmarket, ON L3Y 3Y1<br>905-895-8663<br>admin@cassidysflowersandgifts.com</p>

            <div class="map-box">
                <img src="map.png" alt="Map Location" />
            </div>
        </div>
    </section>
</body>
</html>
